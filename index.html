<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RiftGauge</title>

<!-- PWA meta -->
<meta name="application-name" content="RiftGauge">
<meta name="description" content="Riftbound Victory Point Tracker">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiftGauge">
<meta name="theme-color" content="#06040f">
<meta name="msapplication-TileColor" content="#06040f">
<meta name="msapplication-navbutton-color" content="#06040f">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Gradient defs used by the VP progress rings -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="vp-grad-danger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4a4a"/>
      <stop offset="100%" style="stop-color:#ff8080"/>
    </linearGradient>
  </defs>
</svg>

<div id="particles"></div>

<!-- Legend picker modal -->
<div id="legend-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Choose Legend</span>
      <button class="modal-close" id="legend-modal-close" type="button">✕</button>
    </div>

    <input
      class="modal-search"
      type="text"
      placeholder="Search legends…"
      id="legend-search"
      autocomplete="off"
    >

    <div class="modal-list" id="legend-list"></div>

    <div class="modal-champion-row" id="modal-champion-row">
      <label class="modal-champion-label" for="modal-champion-input">Chosen Champion</label>
      <select class="modal-champion-input" id="modal-champion-input"></select>
      <button class="modal-confirm-btn" id="modal-confirm-btn" type="button">✓ Confirm</button>
    </div>

    <button class="modal-clear" id="modal-clear-btn" type="button">✕ Clear Legend</button>
  </div>
</div>

<!-- Battlefield picker modal (cosmetic reference only — no effect on VP target) -->
<div id="battlefield-modal">
  <div class="bf-modal-box">
    <div class="bf-modal-header">
      <span class="bf-modal-title">Choose Battlefield</span>
      <button class="bf-modal-close" id="bf-modal-close-btn" type="button">✕</button>
    </div>

    <input
      class="bf-modal-search"
      type="text"
      placeholder="Search battlefields…"
      id="bf-search"
      autocomplete="off"
    >

    <div class="bf-modal-list" id="bf-list"></div>

    <button class="bf-modal-clear" id="bf-modal-clear-btn" type="button">✕ Clear Battlefield</button>
  </div>
</div>

<!-- Winner overlay -->
<div id="winner-overlay">
  <div class="winner-box">
    <div class="winner-rune">◈</div>
    <div class="winner-label">Victory Achieved</div>
    <div id="winner-name" class="winner-name">Champion</div>
    <div class="winner-sub">has conquered the Rift</div>
    <button class="winner-close" id="winner-close-btn" type="button">Continue</button>
  </div>
</div>

<div id="layout">
  <div class="half top" id="half-0">
    <div class="domain-bg" id="bg-0"></div>
    <div class="danger-overlay"></div>
    <div class="player-panel" id="panel-0"></div>
  </div>

  <div id="divider">
    <div class="rune-gem"></div>
    <span class="div-title">RIFTGAUGE</span>
    <div class="rune-gem"></div>
    <div class="div-sep"></div>

    <span class="ctrl-label">Win At</span>
    <select class="mode-select" id="mode-select">
      <option value="8">8 — Standard</option>
      <option value="11">11 — Team 2v2</option>
      <option value="10">10 — Custom</option>
      <option value="12">12 — Custom</option>
    </select>

    <div class="div-sep"></div>
    <button class="btn-lighten" id="btn-lighten" type="button">☀ Lighten BG</button>

    <div class="div-sep"></div>
    <button class="btn-reset" id="btn-reset" type="button">⟳ Reset</button>
  </div>

  <div class="half bottom" id="half-1">
    <div class="domain-bg" id="bg-1"></div>
    <div class="danger-overlay"></div>
    <div class="player-panel" id="panel-1"></div>
  </div>
</div>

<script type="module" src="app.js"></script>

<!-- Service worker registration (offline caching — see sw.js) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    });
  }
</script>
</body>
</html>
